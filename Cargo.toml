[package]
name = "maguro"
version = "0.3.6"
edition = "2021"
description = "Fast multi-pane file manager for Windows"
license = "MIT"
repository = "https://github.com/Samek86/maguro"
publish = false

[[bin]]
name = "maguro"
path = "src/main.rs"

[dependencies.windows]
version = "0.62"
features = [
    "Data_Pdf",
    "Foundation",
    "Storage",
    "Storage_Streams",
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Graphics_Direct2D",
    "Win32_Graphics_Direct2D_Common",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Imaging",
    "Win32_Media_MediaFoundation",
    "Win32_Security",
    "Win32_Storage_EnhancedStorage",
    "Win32_Storage_FileSystem",
    "Win32_Storage_Packaging_Appx",
    "Win32_System_Com",
    "Win32_System_IO",
    "Win32_System_Kernel",
    "Win32_System_Com_StructuredStorage",
    "Win32_Networking_WinHttp",
    "Win32_System_DataExchange",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_ProcessStatus",
    "Win32_System_Registry",
    "Win32_System_RestartManager",
    "Win32_System_SystemInformation",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
    "Win32_System_Time",
    "Win32_System_Variant",
    "Win32_UI_Accessibility",
    "Win32_UI_Controls",
    "Win32_UI_Controls_Dialogs",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_Ime",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_NetworkManagement_WNet",
    "Win32_Security_Credentials",
    "Win32_System_JobObjects",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Storage_Vhd",
    "Win32_System_Ioctl",
]

[dependencies.windows-core]
version = "0.62"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1.11.1"
# Inflate for ZIP-based documents in the preview. Pure Rust, no C. Not called until F3 opens one.
miniz_oxide = { version = "0.8", default-features = false, features = ["with-alloc"] }
# SHA-256 of a downloaded update. Pure Rust, no C. Used only by the in-app updater.
sha2 = { version = "0.10.8", default-features = false }
# rclone's password obscuring is AES-256-CTR. Pure Rust, so a password never reaches `rclone obscure`.
aes = { version = "0.8.4", default-features = false }
ctr = "0.9.2"
base64 = "0.22.1"
# 7z folder view. LZMA, LZMA2 and BCJ are always built in. Optional codecs stay
# on the ones 7-Zip actually writes: deflate, bzip2, PPMd, plus AES so an
# encrypted archive fails with a clear error instead of a bad header.
sevenz-rust2 = { version = "0.27.0", default-features = false, features = ["aes256", "bzip2", "compress", "deflate", "ppmd", "util"] }
tar = "0.4.46"
# rust_backend is miniz_oxide, already in this crate for previews. No C zlib.
flate2 = { version = "1.1.11", default-features = false, features = ["rust_backend"] }
# XZ for .tar.xz. Pure Rust. `encoder` is only so tests can build a fixture.
lzma-rust2 = { version = "0.26.0", default-features = false, features = ["std", "xz", "encoder"] }
# Default backend is libbz2-rs-sys (pure Rust). The C `bzip2-sys` feature stays off.
bzip2 = "0.6.1"

[features]
icon-catalog-preview = []

[profile.release]
# Speed over size. "z" cut inlining in search, list compare, JSON, and preview decode.
# Thin the binary later if size matters; panic stays unwind so crash::guard can catch it.
opt-level = 3
lto = true
codegen-units = 1
panic = "unwind"
strip = true
